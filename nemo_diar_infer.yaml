# Official NVIDIA meeting inference config
# Source: https://github.com/NVIDIA-NeMo/Speech/blob/main/examples/speaker_tasks/diarization/conf/inference/diar_infer_meeting.yaml
name: ClusterDiarizer
num_workers: 1
sample_rate: 16000
batch_size: 64
device: null
verbose: True

diarizer:
  manifest_filepath: ???
  out_dir: ???
  oracle_vad: False
  collar: 0.25
  ignore_overlap: True

  vad:
    model_path: vad_multilingual_marblenet
    external_vad_manifest: null
    parameters:
      window_length_in_sec: 0.63
      shift_length_in_sec: 0.01
      smoothing: False
      overlap: 0.5
      onset: 0.9
      offset: 0.5
      pad_onset: 0
      pad_offset: 0
      min_duration_on: 0
      min_duration_off: 0.6
      filter_speech_first: True

  speaker_embeddings:
    model_path: titanet_large
    parameters:
      window_length_in_sec: [3.0, 2.5, 2.0, 1.5, 1.0, 0.5]
      shift_length_in_sec: [1.5, 1.25, 1.0, 0.75, 0.5, 0.25]
      multiscale_weights: [1, 1, 1, 1, 1, 1]
      save_embeddings: False

  clustering:
    parameters:
      oracle_num_speakers: True
      max_num_speakers: 8
      enhanced_count_thres: 80
      max_rp_threshold: 0.25
      sparse_search_volume: 30
      maj_vote_spk_count: False
      chunk_cluster_count: 50
      embeddings_per_chunk: 10000
